databases:
  - name: law-portal-db
    databaseName: law_portal_db
    user: law_portal_user

services:
  - type: web
    name: law-portal
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn law_portal.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: law-portal-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: WEB_CONCURRENCY
        value: 4